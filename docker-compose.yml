services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      WEBAPP_URL: ${WEBAPP_URL:-http://localhost:5173}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3001}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-replace_me}
      JWT_SECRET: ${JWT_SECRET:-replace_me}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./dev.db}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app

  webapp:
    build:
      context: .
      dockerfile: apps/webapp/Dockerfile
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEBAPP_PORT:-5173}:5173"
    volumes:
      - ./apps/webapp:/app/apps/webapp
      - /app/node_modules
    depends_on:
      - backend

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    volumes:
      - ./apps/admin:/app/apps/admin
      - /app/node_modules
    depends_on:
      - backend
